appId: dev.boobot.desktop
productName: Boobot
directories:
  output: dist
files:
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!**/.env"
  - "!**/.env.*"
  # As CLIs são detectadas na máquina; não duplicar o executável Claude do SDK.
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  # O renderer já contém o editor e seus workers compilados pelo Vite.
  - "!**/node_modules/monaco-editor/**"
asar: true
# Alimentado pela publicação dos instaladores; por padrão os feeds não estão configurados.
extraResources:
  - from: update-feed.json
    to: update-feed.json
  - from: src/main/marketplace/catalog
    to: marketplace
# As dependências nativas devem ser validadas no Electron empacotado.
# O rebuild automático de node-pty falha no caminho original com espaços.
npmRebuild: false
asarUnpack:
  - "**/node_modules/node-pty/**"
  - "**/node_modules/sherpa-onnx-node/**"
  - "**/node_modules/@anthropic-ai/claude-agent-sdk*/**"
win:
  icon: branding/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  executableName: Boobot
  # Assinatura: sem certificado o build sai sem assinar (como hoje). Com
  # CSC_LINK + CSC_KEY_PASSWORD (ou WIN_CSC_LINK) no ambiente, o electron-builder
  # assina o app e o instalador com signtool. Para Azure Trusted Signing, troque
  # signtoolOptions por azureSignOptions (veja docs/release.md).
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.digicert.com
nsis:
  artifactName: Boobot-Setup-${version}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
# Releases no GitHub. Publicar exige GH_TOKEN e --publish explícito; o
# dist:win usa --publish never. O app instalado lê o repositório de
# update-feed.json e não usa token: com repositório privado a checagem falha
# (404) até as releases irem para um repositório público (docs/release.md).
publish:
  provider: github
  owner: lchenrique
  repo: politron-agents
  releaseType: draft
