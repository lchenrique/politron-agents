appId: dev.boobot.desktop
productName: Boobot
directories:
  output: dist
files:
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!**/.env"
  - "!**/.env.*"
  # As CLIs são detectadas na máquina; não duplicar o executável Claude do SDK.
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  # O renderer já contém o editor e seus workers compilados pelo Vite.
  - "!**/node_modules/monaco-editor/**"
asar: true
# Alimentado pela publicação dos instaladores; por padrão os feeds não estão configurados.
extraResources:
  - from: update-feed.json
    to: update-feed.json
  - from: src/main/pwa/assets
    to: pwa
  - from: src/main/marketplace/catalog
    to: marketplace
# As dependências nativas devem ser validadas no Electron empacotado.
# O rebuild automático de node-pty falha no caminho original com espaços.
npmRebuild: false
asarUnpack:
  - "**/node_modules/node-pty/**"
  - "**/node_modules/sherpa-onnx-node/**"
  - "**/node_modules/@anthropic-ai/claude-agent-sdk*/**"
win:
  icon: branding/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  executableName: Boobot
nsis:
  artifactName: Boobot-Setup-${version}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
# Repositório é privado: o app rodando não consegue checar/baixar releases sem
# um token, e não dá pra embutir token de acesso num instalador distribuído.
# Só funciona de verdade se o repo virar público ou as releases saírem daqui
# pra um host público (ex.: bucket HTTP com provider "generic").
publish:
  provider: generic
  url: https://updates.example.invalid/boobot/
# O URL acima é apenas placeholder de empacotamento; o updater usa exclusivamente
# os feeds HTTPS definidos em update-feed.json. Configure o host antes de publicar.
